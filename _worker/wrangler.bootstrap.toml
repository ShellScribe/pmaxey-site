name = "pmaxey-contact"
main = "src/index.mjs"
compatibility_date = "2026-10-19"
workers_dev = false
preview_urls = false

# First deployment only: no website routes and no workers.dev/preview URLs.
# After both secrets are configured, deploy wrangler.toml to attach the two routes.
routes = []

[vars]
ALLOWED_ORIGIN = "https://pmaxey.com"
TURNSTILE_HOSTNAME = "pmaxey.com"
TURNSTILE_ACTION = "contact"
# Set CONTACT_EMAIL and TURNSTILE_SECRET as Worker secrets, never here.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
